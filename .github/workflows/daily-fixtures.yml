name: "Daily: Post Champions League fixtures"

on:
  schedule:
    # Runs each morning before the day's fixtures. Avoid the top of the hour,
    # where GitHub scheduled workflows are more likely to be delayed or dropped.
    - cron: "17 8 * * *"
      timezone: "Europe/London"
  workflow_dispatch:
    inputs:
      window_start:
        description: "Optional override, e.g. 2026-09-08T08:00:00+01:00"
        required: false
        type: string

concurrency:
  group: champions-league-discord-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      INPUT_WINDOW_START: ${{ github.event.inputs.window_start }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Check out tracker
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build daily fixture request
        id: daily-fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:INPUT_WINDOW_START)) {
            $resultText = .\BuildDailyFixturesRequest.ps1
          } else {
            $resultText = .\BuildDailyFixturesRequest.ps1 -WindowStart $env:INPUT_WINDOW_START
          }

          $result = ($resultText | Out-String).Trim() | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 6

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "status=$($result.Status)" -Encoding UTF8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "request_id=$($result.RequestId)" -Encoding UTF8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "fixture_count=$($result.FixtureCount)" -Encoding UTF8

      - name: Publish fixture graphic and save receipt
        if: steps.daily-fixtures.outputs.status == 'created'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            throw 'Repository secret DISCORD_WEBHOOK_URL is not configured.'
          }

          $webhookPath = Join-Path $env:RUNNER_TEMP 'discord-webhook.txt'
          [System.IO.File]::WriteAllText($webhookPath, $env:DISCORD_WEBHOOK_URL, [System.Text.UTF8Encoding]::new($false))

          try {
            .\PublishRequests.ps1 -WebhookPath $webhookPath -MaxRequests 1

            git config user.name 'champions-league-update-bot'
            git config user.email 'champions-league-update-bot@users.noreply.github.com'
            git add -- requests/inbox requests/processed requests/delivery-ledger.jsonl

            $changes = git status --porcelain
            if (-not [string]::IsNullOrWhiteSpace($changes)) {
              git commit -m "Record delivered Champions League fixtures"
              git push origin "HEAD:$env:GITHUB_REF_NAME"
            } else {
              'Nothing changed after publishing.'
            }
          } finally {
            Remove-Item -LiteralPath $webhookPath -Force -ErrorAction SilentlyContinue
          }

      - name: Report skipped day
        if: steps.daily-fixtures.outputs.status != 'created'
        shell: powershell
        run: |
          "No fixture graphic was posted. Status: $env:STATUS"
        env:
          STATUS: ${{ steps.daily-fixtures.outputs.status }}
